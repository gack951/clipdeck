[package]
name = "clipdeck"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
arboard = "3.6"
clipboard-win = "5.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde", "clock"] }
url = "2"

[profile.release]
lto = "thin"
strip = true
